name: Release

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/CalculatorPlusPlus-v3.0.0.apk
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/CalculatorPlusPlus-v3.0.0-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/CalculatorPlusPlus-v3.0.0-debug.apk
            if [ ! -f release-artifacts/CalculatorPlusPlus-v3.0.0.apk ]; then
              cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/CalculatorPlusPlus-v3.0.0.apk
            fi
          fi
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Calculator++ v3.0.0 (Modernized & Privacy Edition)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*.apk
          body: |
            ## Calculator++ v3.0.0 (Modernized & Privacy Edition)

            A major modernization release updating Calculator++ to Android 15 (API 35) with a privacy-first, zero-permission architecture, rich Material Design 3 themes, Indian & international numbering formats, memory functions, digital storage conversions, and floating calculator enhancements.

            ### 🌟 Key Highlights & Changes
            - **100% Offline & Absolute Privacy**: Removed all internet and network state permissions. Completely purged Google Mobile Ads, Firebase Analytics/Crashlytics, and Google Play Billing dependencies.
            - **Target Android 15 (API 35)**: Updated SDK targets, edge-to-edge window insets handling, and Android 14/15 overlay window permissions.
            - **Material 3 UI & Rich Theming**: Added Material You (Monet dynamic colors for Android 12+), AMOLED True Black theme, Slate Grey theme, and 7 vibrant accent colorways (Teal, Blue, Green, Purple, Amber, Red, Pink).
            - **Memory Calculator Functions**: Added dedicated `MC`, `MR`, `M+`, `M-`, and `MS` operations with real-time on-display indicator.
            - **Indian & Western Numbering Formatting**: Support for Indian Lakhs/Crores (`10,00,000`) and Western formatting with configurable separators (apostrophe, space, comma, or none).
            - **Digital Storage Converter**: Unit converter now supports bits, bytes, KB, MB, GB, TB, PB, KiB, MiB, GiB, TiB, and PiB alongside base conversions (HEX, DEC, OCT, BIN).
            - **Floating Calculator Quick Settings Tile**: Direct access tile in Android Quick Settings shade to launch the floating calculator instantly.
            - **Export & Share History**: Share calculation history as text or CSV via standard Android share sheet.
            - **Modern Haptics**: Context-aware vibrational feedback powered by Android's `VibrationEffect` (click and tick modes).

            ### 📦 Downloads
            - **`CalculatorPlusPlus-v3.0.0.apk`** — Standard ready-to-install APK (signed).
            - **`CalculatorPlusPlus-v3.0.0-release.apk`** — Release build APK.
            - **`CalculatorPlusPlus-v3.0.0-debug.apk`** — Debug build APK.

            ### 🤝 Credits & Acknowledgements
            - **Original Creator & Architect**: Sergey Solovyev ([@serso](https://github.com/serso))
            - **Modernization & Fork Lead**: Naveen Kumar Yeluri ([@NaveenKumarYeluri](https://github.com/NaveenKumarYeluri))
            - Core engine powered by **JSCL (Java Symbolic Computation Library)**.
            - Open source contributors & Crowdin localization community.
